<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Replace with a real elegant font -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <title>Klimasutra</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            position: absolute;
            top: 20px;
            left: 20px;
            margin: 0;

            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 32px;
            letter-spacing: 1px;
        }

        img {
            display: block;
            margin: 80px auto 20px auto; /* push image down so it doesn't overlap */
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <h1>Klimasutra</h1>
        <div class="nav">
            <button onclick="showTab('weather')">Weather</button>
            <button onclick="showTab('climate')">Climate</button>
        </div>
    </div>

    <div class="content">
        <div id="weather" class="tab active">
            <img src="weather_dashboard.png" alt="Weather Dashboard">
        </div>

        <div id="climate" class="tab">
            <p>Climate content goes here</p>
        </div>
    </div>

    <script>
        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
        }
    </script>
</body>
