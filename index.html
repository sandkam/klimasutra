<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Replace with a real elegant font -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <title>Klimasutra</title>

    <style>
    body {
    	margin: 0;
    	font-family: sans-serif;
    	display: flex;   /* THIS creates sidebar layout */
    }

    /* LEFT PANEL */
    .sidebar {
    	width: 220px;
    	height: 100vh;
    	padding: 20px;
    	border-right: 1px solid #ddd;
    	background: #fafafa;
    	box-sizing: border-box;
    }

    /* TITLE */
    .sidebar h1 {
    	margin: 0 0 30px 0;
    	font-family: 'Playfair Display', serif;
    }

    /* BUTTONS */
    .nav button {
    	display: block;
    	width: 100%;
    	padding: 10px;
    	margin-bottom: 10px;
    	border: none;
    	background: none;
    	text-align: left;
    	cursor: pointer;
    }

    .nav button:hover {
    background: #eee;
    }

    /* RIGHT SIDE */
    .content {
    	flex: 1;
    	padding: 20px;
    }

    /* TAB SYSTEM */
    .tab {
    	display: none;
    }

    .tab.active {
    	display: block;
    }

    /* IMAGE */
    img {
    	max-width: 100%;
    }
</style>
</head>

<body>
    <div class="sidebar">
    	<h1>Klimasutra</h1>
    	<div class="nav">
        	<button onclick="showTab('home')">Home</button>
        	<button onclick="showTab('weather')">Weather</button>
        	<button onclick="showTab('climate')">Climate</button>
    	</div>
    </div>

    <div class="content">

    	<!-- DEFAULT IMAGE -->
    	<div id="home" class="tab active">
        	<img src="Earth_mark_twain.jpg" alt="Default View">
    	</div>

    	<!-- WEATHER -->
    	<div id="weather" class="tab">
        	<img src="weather_dashboard.png" alt="Weather Dashboard">
    	</div>

    	<!-- CLIMATE -->
    	<div id="climate" class="tab">
        	<p>Climate content goes here</p>
    	</div>

    </div>

    <script>
        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
        }
    </script>
</body>
